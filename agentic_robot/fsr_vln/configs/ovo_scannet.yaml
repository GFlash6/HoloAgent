project_name: ovo
checkpoint_path: null
use_wandb: False
device: cuda:5
frame_limit: -1 # for debugging, set to -1 to disable
seed: 0
slam:
  config_path: configs/slam
  slam_module: vanilla #gaussian_slam #orbslam2 # common
  use_viewer: False # only used with orbslam2
  close_loops: True # only used with orbslam2
vis:
  stream: False
  show_stream: False # this is going to be ignored if stream is false
mapping:
  map_every: 10 # 1 for sh_3f 2 for ic_3f
semantic:
  segment_every: 10 # 1 for sh_3f 2 for ic_3f
  use_gt_masks: False
  use_gt_clips: False
  use_iggt: True
  match_distance_th: 0.05 #0.01
  track_th: 100 #100
  depth_filter: True 
  log: True
  use_ram_groundingdino_sam2: False
  # ram_groundingdino:
  #   ram_checkpoint_path: "${HOLOAGENT_DATA_ROOT}/VLN/vln_tmp/mapdsg/checkpoints/recognize_anything/ram_swin_large_14m.pth"
  #   bert_base_uncased_path: "${HOLOAGENT_DATA_ROOT}/VLN/vln_tmp/mapdsg/checkpoints/bert-base-uncased"
  #   grounding_dino_config_path: "${HOLOAGENT_DATA_ROOT}/VLN/vln_tmp/mapdsg/checkpoints/GroundingDINO/GroundingDINO_SwinT_OGC.py"
  #   grounding_dino_checkpoint_path: "${HOLOAGENT_DATA_ROOT}/VLN/vln_tmp/mapdsg/checkpoints/GroundingDINO/groundingdino_swint_ogc.pth"
  # iggt:
  #   model_path: "${HOLOAGENT_DATA_ROOT}/VLN/instance_tracking/checkpoint/best_ckpt.pth"
  #   config_path: "${HOLOAGENT_DATA_ROOT}/VLN/instance_tracking/mapvln/ovo_slam/thirdparty/iggt_infer/configs/sam-t.yaml"
  #   use_iggt_geometry: False
  #   cluster_threshold: 0.70
  #   device: cuda:4
  sam:
    use_cluster_mask: False
    precomputed: False
    multi_crop: True
    points_per_side: 16
    # sam_ckpt_path: "data/input/sam_ckpts/"
    sam_ckpt_path: "${HOLOAGENT_DATA_ROOT}/VLN/vln_tmp/mapdsg/checkpoints/sam2"
    mask_res: 384
    sam_version: "2.1"
    sam_encoder: "hiera_t"
    masks_base_path: "data/working/masks/replica_384_sam2.1"
    # nms_iou_th: 0.85
    # stability_score_thresh: 0.85
    # min_mask_region_area: 100
  clip:
    use_half: True
    embed_type: fixed_weights #fixed_weights # learned
    model_card: SigLIP-384 #ViT-H-14 #
    weights_predictor_path: ${HOLOAGENT_DATA_ROOT}/VLN/instance_tracking/data/input/weights_predictor/base
    k_top_views: 10
kf_queue_delay: 10
min_points_th: 10
min_track_frames_th: 2
window_size: 80
overlap: 40
