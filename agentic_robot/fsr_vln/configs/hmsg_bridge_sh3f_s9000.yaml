main:
  depth_cut: 20
  use_gpt: False
  skip_sam_init: True

models:
  clip:
    type: SigLIP-384
    checkpoint: hf-hub:timm/ViT-SO400M-14-SigLIP-384
  sam:
    type: vit_h
    checkpoint: ""
    points_per_side: 16
    pred_iou_thresh: 0.86
    points_per_batch: 64
    stability_score_thresh: 0.92
    crop_n_layers: 1
    min_mask_region_area: 100

pipeline:
  voxel_size: 0.05 # 0.02 for sh3f,0.05 for ic3f/ic4f/ic7f
  skip_frames: 8 # 
  init_overlap_thresh: 0.75
  overlap_thresh_factor: 0.025
  iou_thresh: 0.05
  clip_masked_weight: 0.4418
  clip_bbox_margin: 50 # in pixels
  feature_dbscan_eps: 0.01
  max_mask_distance: 10000 # 6.4239 in meters
  min_pcd_points: 100
  depth_weighting: false
  grid_resolution: 0.05
  merge_type: sequential # hierarchical
  save_intermediate_results: true
  obj_labels: SCANNET200 #SCANNET200 #SCANNET20 #COCO_STUFF_CLASSES #IMAGENET21K_LABELS #HM3DSEM_LABELS
  merge_objects_graph: false  
